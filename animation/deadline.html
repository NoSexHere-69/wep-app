<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Deadline Loading</title>
<style>
  :root{
    --bg:#0b0e14;
    --bar-bg:#1c2230;
    --red:#3fae5c;
    --red-dark:#276b39;
    --text:#e6e6e6;
    --accent:#ffd24d;
  }
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', monospace;
  }
  .stage{
    width:min(700px,90vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .track-wrap{
    position:relative;
    width:100%;
    height:120px;
  }
  .track{
    position:absolute;
    top:50%;
    left:0;
    right:0;
    transform:translateY(-50%);
    height:26px;
    background:var(--bar-bg);
    border-radius:13px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .fill{
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    width:0%;
    background:linear-gradient(90deg,var(--red-dark),var(--red));
    border-radius:13px 0 0 13px;
  }
  .reaper{
    position:absolute;
    top:50%;
    left:0%;
    width:56px;
    height:70px;
    transform:translate(-50%,-68%);
    transition:left .05s linear;
  }
  .worker{
    position:absolute;
    top:50%;
    right:-2px;
    width:56px;
    height:66px;
    transform:translateY(-62%);
  }
  .label{
    text-align:center;
    color:var(--accent);
    letter-spacing:1px;
    font-size:15px;
  }
  .label .days{
    font-size:22px;
    font-weight:bold;
    display:block;
    margin-top:4px;
  }
  svg{ display:block; width:100%; height:100%; }
  .skull-blink{ opacity:1; }

  @keyframes bob{
    0%,100%{ transform:translate(-50%,-68%) translateY(0); }
    50%{ transform:translate(-50%,-68%) translateY(-3px); }
  }
  .reaper{ animation:bob .5s ease-in-out infinite; }

  @keyframes typeShake{
    0%,100%{ transform:translateY(-62%) translateY(0); }
    50%{ transform:translateY(-62%) translateY(-1.5px); }
  }
  .worker{ animation:typeShake .35s ease-in-out infinite; }
</style>
</head>
<body>

<div class="stage">
  <div class="track-wrap">
    <div class="track">
      <div class="fill" id="fill"></div>
    </div>

    <div class="reaper" id="reaper">
      <svg viewBox="0 0 60 76" fill="none">
        <!-- running legs -->
        <line x1="24" y1="56" x2="16" y2="70" stroke="#ffd24d" stroke-width="4" stroke-linecap="round"/>
        <line x1="34" y1="56" x2="44" y2="68" stroke="#ffd24d" stroke-width="4" stroke-linecap="round"/>
        <!-- running arms -->
        <line x1="16" y1="34" x2="6" y2="26" stroke="#ffd24d" stroke-width="4" stroke-linecap="round"/>
        <line x1="42" y1="34" x2="52" y2="44" stroke="#ffd24d" stroke-width="4" stroke-linecap="round"/>
        <!-- coin body -->
        <circle cx="29" cy="34" r="20" fill="#ffd24d" stroke="#c98f00" stroke-width="2"/>
        <circle cx="29" cy="34" r="14" fill="none" stroke="#c98f00" stroke-width="2"/>
        <text x="29" y="41" text-anchor="middle" font-size="18" font-weight="bold" fill="#c98f00" font-family="Arial, sans-serif">฿</text>
        <!-- motion lines -->
        <line x1="2" y1="20" x2="10" y2="20" stroke="#ffd24d" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="0" y1="30" x2="8" y2="30" stroke="#ffd24d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>

    <div class="worker">
      <svg viewBox="0 0 60 70" fill="none">
        <!-- wallet body -->
        <rect x="6" y="26" width="48" height="34" rx="6" fill="#2b1d10" stroke="#f2f2f2" stroke-width="2"/>
        <path d="M6 34 C 6 30, 10 26, 14 26 L 46 26 C 50 26, 54 30, 54 34 L 54 38 L 6 38 Z" fill="#3d2a16" stroke="#f2f2f2" stroke-width="2"/>
        <!-- flap / clasp -->
        <rect x="40" y="34" width="10" height="10" rx="2" fill="#ffd24d" stroke="#c98f00" stroke-width="1.5"/>
        <!-- stitch line -->
        <line x1="6" y1="48" x2="54" y2="48" stroke="#f2f2f2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
        <!-- peeking bill -->
        <rect x="14" y="14" width="26" height="16" rx="2" fill="#3fae5c" stroke="#276b39" stroke-width="1.5"/>
        <text x="27" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#e9fff0" font-family="Arial, sans-serif">฿</text>
      </svg>
    </div>
  </div>

  <div class="label">
    <span>เงินกำลังวิ่งเข้ากระเป๋า</span>
    <span class="days" id="daysLabel">5 days</span>
  </div>
</div>

<script>
  // ---- ตั้งค่าได้ตรงนี้ ----
  const TOTAL_DAYS = 5;      // จำนวนวันเริ่มต้นที่จะนับถอยหลัง (แสดงผลเท่านั้น)
  const LOOP_SECONDS = 4;    // เวลาที่ใช้วิ่งจบ 1 รอบ (วินาที) แบบ loading loop
  // --------------------------

  const fillEl = document.getElementById('fill');
  const reaperEl = document.getElementById('reaper');
  const daysEl = document.getElementById('daysLabel');

  let startTime = null;

  function frame(ts){
    if(!startTime) startTime = ts;
    const elapsed = (ts - startTime) / 1000;
    let progress = (elapsed % LOOP_SECONDS) / LOOP_SECONDS; // 0 -> 1 วนซ้ำ
    const pct = progress * 100;

    fillEl.style.width = pct + '%';
    reaperEl.style.left = pct + '%';

    const remaining = Math.max(0, Math.ceil(TOTAL_DAYS * (1 - progress)));
    daysEl.textContent = remaining + (remaining === 1 ? ' day' : ' days');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>

</body>
</html>
