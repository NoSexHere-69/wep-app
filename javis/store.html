<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>armr shop // App Hub</title>
<style>
  :root{
    --bg:#020a0e;
    --bg2:#04141b;
    --panel:#061a22;
    --line:#0f3947;
    --line-bright:#1c6478;
    --cyan:#4bd9ff;
    --cyan-dim:#1c8ba8;
    --amber:#ffb454;
    --text:#dff6ff;
    --muted:#5f8b98;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    padding: calc(18px + var(--safe-top)) 16px calc(40px + var(--safe-bottom));
    user-select:none;
    position:relative;
  }

  /* ---- animated HUD background ---- */
  .bg-fx{
    position:fixed; inset:0;
    z-index:-1;
    overflow:hidden;
    pointer-events:none;
    background:var(--bg);
  }
  .bg-fx::before{
    content:'';
    position:absolute;
    inset:-10%;
    background:
      radial-gradient(ellipse 45% 35% at 20% 15%, rgba(75,217,255,0.16), transparent 60%),
      radial-gradient(ellipse 40% 35% at 85% 25%, rgba(157,140,255,0.10), transparent 60%),
      radial-gradient(ellipse 45% 40% at 50% 95%, rgba(75,217,255,0.10), transparent 60%);
    animation:drift 22s ease-in-out infinite alternate;
  }
  .bg-fx::after{
    content:'';
    position:absolute;
    inset:0 0 -100% 0;
    background:repeating-linear-gradient(0deg, rgba(75,217,255,0.035) 0px, rgba(75,217,255,0.035) 1px, transparent 1px, transparent 3px);
    animation:scan 14s linear infinite;
  }
  @keyframes drift{
    0%  { transform:translate(0,0) scale(1); }
    50% { transform:translate(-2%,2%) scale(1.06); }
    100%{ transform:translate(2%,-2%) scale(1.02); }
  }
  @keyframes scan{
    0%   { transform:translateY(0); }
    100% { transform:translateY(50%); }
  }
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;}

  .wrap{max-width:min(1100px, 96vw);margin:0 auto;}

  /* ---- header / arc reactor ---- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:clamp(10px, 2vw, 18px);
    margin-bottom:clamp(28px, 5vw, 48px);
    padding:clamp(20px, 4vw, 34px) clamp(18px, 4vw, 30px);
    border:1px solid var(--line);
    border-radius:20px;
    background:linear-gradient(180deg, rgba(75,217,255,0.05), transparent);
    position:relative;
  }
  header::before, header::after{
    content:'';
    position:absolute;
    width:16px; height:16px;
    border-color:var(--cyan-dim);
    border-style:solid;
    opacity:.7;
  }
  header::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  header::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .reactor{
    width:clamp(56px, 9vw, 84px);height:clamp(56px, 9vw, 84px);
    border-radius:50%;
    flex-shrink:0;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle, rgba(75,217,255,0.35), rgba(75,217,255,0.05) 65%, transparent 70%);
  }
  .reactor::before{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    border:1.5px solid var(--cyan);
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:spin 4s linear infinite;
    box-shadow:0 0 10px rgba(75,217,255,0.5);
  }
  .reactor-core{
    width:clamp(18px, 3vw, 28px);height:clamp(18px, 3vw, 28px);
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 12px 3px rgba(75,217,255,0.8), 0 0 2px #fff;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.7; transform:scale(0.85);} }

  .title-block{min-width:0;}
  h1{
    font-size:clamp(24px, 4.5vw, 38px);
    font-weight:650;
    margin:0 0 6px;
    letter-spacing:.03em;
  }
  .status-line{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(12px, 1.6vw, 15px);
    letter-spacing:.06em;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .status-dot{
    width:9px;height:9px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 6px 1px rgba(75,217,255,0.8);
    flex-shrink:0;
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---- app grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(100px, 1fr));
    gap:clamp(24px, 4vw, 40px) clamp(12px, 3vw, 24px);
    padding:0 4px;
  }

  .app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    color:inherit;
  }
  .app-icon-ring{
    width:clamp(80px, 15vw, 120px);height:clamp(80px, 15vw, 120px);
    border-radius:50%;
    padding:3px;
    background:conic-gradient(from 0deg, var(--cyan), transparent 30%, transparent 70%, var(--cyan));
    animation:spin 6s linear infinite;
    transition:transform .12s ease;
  }
  .app:active .app-icon-ring{transform:scale(0.9);}
  .app-icon{
    width:100%;height:100%;
    border-radius:50%;
    background:var(--bg2);
    border:1px solid var(--line-bright);
    display:flex;align-items:center;justify-content:center;
    position:relative;
    box-shadow:inset 0 0 14px rgba(75,217,255,0.15);
    overflow:hidden;
  }
  .app-icon img{
    width:68%;
    height:68%;
    object-fit:contain;
  }
  .app-label{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(12px, 1.8vw, 15px);
    letter-spacing:.03em;
    text-transform:uppercase;
    text-align:center;
    color:var(--text);
    line-height:1.3;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .empty{
    grid-column:1/-1;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    text-align:center;
    padding:40px 0;
  }

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:clamp(11px, 1.5vw, 13px);
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.02em;
    text-align:center;
  }

  /* ---- action sheet (HUD panel) ---- */
  .backdrop{
    position:fixed; inset:0;
    background:rgba(2,10,14,0.7);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none;
    transition:opacity .18s ease;
    z-index:40;
  }
  .backdrop.show{opacity:1; pointer-events:auto;}

  .sheet{
    position:fixed;
    left:12px; right:12px; bottom:0;
    margin-bottom: calc(12px + var(--safe-bottom));
    background:var(--panel);
    border:1px solid var(--line-bright);
    border-radius:16px;
    padding:16px 16px 14px;
    transform:translateY(120%);
    transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:50;
    box-shadow:0 0 30px -4px rgba(75,217,255,0.25), 0 10px 40px rgba(0,0,0,0.5);
  }
  .sheet.show{transform:translateY(0);}
  .sheet::before, .sheet::after{
    content:'';
    position:absolute;
    width:12px; height:12px;
    border-color:var(--cyan);
    border-style:solid;
    opacity:.8;
  }
  .sheet::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .sheet::after{ top:-1px; right:-1px; border-width:2px 2px 0 0; }

  .sheet-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .sheet-icon{
    width:56px;height:56px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    background:var(--bg2);
    border:1px solid var(--line-bright);
    overflow:hidden;
  }
  .sheet-icon img{
    width:68%;
    height:68%;
    object-fit:contain;
  }
  .sheet-title{
    font-size:18px; font-weight:650; margin:0;
    letter-spacing:.02em;
  }
  .sheet-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--cyan-dim);
    margin:3px 0 0;
  }

  .sheet-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    padding:13px 12px;
    border-radius:10px;
    border:1px solid transparent;
    background:none;
    color:var(--text);
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
    margin-bottom:8px;
  }
  .sheet-btn .glyph{
    width:32px;height:32px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .sheet-btn .glyph svg{width:16px;height:16px;}
  .sheet-btn small{
    display:block;
    color:var(--muted);
    font-weight:400;
    font-size:11.5px;
    margin-top:1px;
    font-family:'JetBrains Mono',monospace;
    text-transform:none;
    letter-spacing:0;
  }
  .sheet-btn.primary{
    background:rgba(75,217,255,0.08);
    border-color:var(--cyan-dim);
  }
  .sheet-btn.primary .glyph{background:rgba(75,217,255,0.18); color:var(--cyan);}
  .sheet-btn.secondary{border-color:var(--line);}
  .sheet-btn.secondary .glyph{background:rgba(255,255,255,0.04); color:var(--muted);}
  .sheet-btn:active{filter:brightness(1.3);}

  .sheet-cancel{
    width:100%;
    margin-top:4px;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:none;
    color:var(--muted);
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.04em;
    text-transform:uppercase;
  }
</style>
</head>

<div class="bg-fx"></div>
<div class="wrap">

  <header>
    <div class="reactor">
      <div class="reactor-core"></div>
    </div>
    <div class="title-block">
      <h1>Armr store</h1>

    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>TAP AN ICON TO SELECT APP OR SHEET ACCESS</footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="sheet-icon" id="sheetIcon"></div>
    <div>
      <p class="sheet-title" id="sheetTitle"></p>
      <p class="sheet-sub" id="sheetSub"></p>

  </div>

    <span class="glyph"><svg viewBox="0 0 24 24" fill="none"><path d="M13 5h6v6M19 5l-8 8M8 5H6a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>เปิดแอป<small>เข้าใช้งานอินเทอร์เฟซหลัก</small></span>
  </a>
  <a class="sheet-btn secondary" id="btnSheet" target="_blank" rel="noopener">
    <span class="glyph"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <span>เปิดชีต<small>ดูข้อมูลดิบใน Google Sheets</small></span>
  </a>
  <button class="sheet-cancel" id="btnCancel">ยกเลิก</button>
</div>

// ---- HUD sound effects (synthesized, no audio files needed) ----
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function blip({freqStart=700, freqEnd=null, duration=0.09, type="sine", volume=0.05}={}){
  try{
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    if(freqEnd){
      osc.frequency.exponentialRampToValueAtTime(freqEnd, ctx.currentTime + duration);
    }
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){ /* audio not available, fail silently */ }
}
const sfx = {
  tap:     () => blip({freqStart:640, freqEnd:1000, duration:0.07, type:"sine",     volume:0.045}),
  confirm: () => blip({freqStart:820, freqEnd:1400, duration:0.11, type:"triangle", volume:0.05}),
  select:  () => blip({freqStart:520, freqEnd:760,  duration:0.09, type:"sine",     volume:0.045}),
  cancel:  () => blip({freqStart:520, freqEnd:260,  duration:0.10, type:"sine",     volume:0.04}),
};

function renderGrid(){
  const grid = document.getElementById("grid");
  if(DATA.length === 0){
    grid.innerHTML = `<div class="empty">NO APPS LINKED</div>`;
    return;
  }
  grid.innerHTML = DATA.map((app, i) => `
    <button class="app" data-index="${i}">
      <div class="app-icon-ring">
        <div class="app-icon">
          <img src="${app.icon}" alt="${app.name}">
        </div>
      </div>
      <span class="app-label">${app.name}</span>
    </button>
  `).join("");
  grid.querySelectorAll(".app").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      sfx.tap();
      openSheet(DATA[btn.dataset.index]);
    });
  });
}

// ---- action sheet logic ----
const backdrop = document.getElementById("backdrop");
const sheet = document.getElementById("sheet");

function openSheet(app){
  document.getElementById("sheetIcon").innerHTML = `<img src="${app.icon}" alt="${app.name}">`;
  document.getElementById("sheetTitle").textContent = app.name;
  document.getElementById("sheetSub").textContent = app.group.toUpperCase() + " CHANNEL";
  document.getElementById("btnApp").href = app.webapp;
  document.getElementById("btnSheet").href = app.sheet;
  backdrop.classList.add("show");
  sheet.classList.add("show");
}
function closeSheet(){
  backdrop.classList.remove("show");
  sheet.classList.remove("show");
}
document.getElementById("btnApp").addEventListener("click", ()=> sfx.confirm());
document.getElementById("btnSheet").addEventListener("click", ()=> sfx.select());
document.getElementById("btnCancel").addEventListener("click", ()=>{ sfx.cancel(); closeSheet(); });
backdrop.addEventListener("click", ()=>{ sfx.cancel(); closeSheet(); });

renderGrid();
</script>
